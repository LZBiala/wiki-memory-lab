# The drift gate: claims treated like SLOs.
#
# Every push, on BOTH Windows and Linux, with zero secrets:
#   1. the contract suite (includes determinism + no-wall-clock tests)
#   2. the repo hygiene gate
#   3. a full regeneration of every artifact (wiki/, runs/, report/, metrics.jsonl,
#      and the README's autogenerated claims block)
#   4. `git diff --exit-code` — if ANY committed number, transcript, chart, or
#      note differs from the fresh run, the build fails.
#
# The committed artifacts ARE the claims; CI proves they regenerate.
name: drift-gate

on: [push, pull_request]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned: byte-identity guarantees are version-scoped
      - name: install (runtime is stdlib-only; dev extra is pytest)
        run: pip install -e ".[dev]"
      - name: contract suite
        run: pytest -q
      - name: repo hygiene gate
        run: python tools/blocklist_check.py
      - name: regenerate every published artifact
        run: python -m wikimemlab demo --quiet
      - name: fail on any drift between committed claims and the fresh run
        run: git diff --exit-code
